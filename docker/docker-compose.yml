version: "3.9"
services:

  backend:
    build:
      context: ../src
    restart: on-failure
    ports:
      - 8000:8000
    depends_on:
      - mongo
    env_file:
      - .backend.env
    volumes:
      - ../src:/app/src


  mongo:
    image: mongo:6.0.8
    restart: on-failure
    ports:
      - 27017:27017
    env_file:
      - .mongo.env
    volumes:
      - ./data:/data/db
